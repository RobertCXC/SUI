name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version tag: $env:GITHUB_REF_NAME" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        run: dotnet build SUI.slnx -c Release -p:Version=${{ steps.ver.outputs.version }}
      - name: Pack library
        run: dotnet pack SUI.csproj -c Release --no-build -p:Version=${{ steps.ver.outputs.version }} -o artifacts
      - name: Publish sample
        run: dotnet publish samples/SUI.Gallery/SUI.Gallery.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.ver.outputs.version }} -o publish/gallery
      - name: Zip sample
        shell: pwsh
        run: Compress-Archive -Path publish/gallery/* -DestinationPath "artifacts/SUI.Gallery-${{ steps.ver.outputs.version }}-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error

  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # nuget.org Trusted Publishing: exchanges the GitHub OIDC token (id-token: write)
      # for a short-lived API key. `user` is the nuget.org profile name that owns the
      # trusted publishing policy (not a secret), so no NUGET_USER secret is needed.
      - name: NuGet trusted publishing login
        id: login
        uses: NuGet/login@v1
        with:
          user: Tgmmlg
      - name: Push package
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag $flags
