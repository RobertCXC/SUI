name: Documentation

on:
  push:
    paths: ['doc/**', 'docs/**', 'scripts/Build-Docs.ps1', 'scripts/docs/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['doc/**', 'docs/**', 'scripts/Build-Docs.ps1', 'scripts/docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated manual and links
        shell: pwsh
        run: ./scripts/Build-Docs.ps1 -Check
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check docs/assets/theme.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check docs/assets/manual.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
